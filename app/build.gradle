plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def versionNameValue = providers.gradleProperty('ADMIN_VERSION_NAME').get()
def versionCodeValue = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'org.gsgit.admin'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'org.gsgit.admin'
        minSdk 26
        targetSdk 37
        versionCode versionCodeValue
        versionName versionNameValue
    }

    signingConfigs {
        release {
            def storePath = providers.gradleProperty('ADMIN_RELEASE_STORE_FILE').orNull
            if (storePath) storeFile file(storePath)
            storePassword providers.gradleProperty('ADMIN_RELEASE_STORE_PASSWORD').orNull
            keyAlias providers.gradleProperty('ADMIN_RELEASE_KEY_ALIAS').orNull
            keyPassword providers.gradleProperty('ADMIN_RELEASE_KEY_PASSWORD').orNull
        }
    }

    buildTypes {
        release {
            if (providers.gradleProperty('ADMIN_RELEASE_STORE_FILE').present) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'org.jetbrains.compose.runtime:runtime:1.11.1'
    implementation 'org.jetbrains.compose.foundation:foundation:1.11.1'
    implementation 'org.jetbrains.compose.ui:ui:1.11.1'
    implementation 'org.jetbrains.compose.ui:ui-graphics:1.11.1'
    implementation 'org.jetbrains.compose.ui:ui-tooling-preview:1.11.1'
    implementation 'io.github.kyant0:backdrop:2.0.0'
    implementation 'io.github.kyant0:shapes:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'

    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'org.jetbrains.compose.ui:ui-tooling:1.11.1'
}
