name: Сборка Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: admin-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Проверка и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Установка Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Проверка кода и тесты
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest --stacktrace

      - name: Проверка наличия секретов release-подписи
        id: release_secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ADMIN_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ADMIN_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ADMIN_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ADMIN_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf 'enabled=true\n' >> "$GITHUB_OUTPUT"
            printf 'Release-подпись настроена. Собираю подписанный APK.\n'
          else
            printf 'enabled=false\n' >> "$GITHUB_OUTPUT"
            printf '::error::Не настроены все четыре секрета release-подписи.\n'
            exit 1
          fi

      - name: Восстановление release-ключа
        if: steps.release_secrets.outputs.enabled == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ADMIN_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          marker='/u3+7QAAAAIA'
          if [[ "$KEYSTORE_BASE64" == *"$marker"* ]]; then
            normalized="$marker${KEYSTORE_BASE64#*"$marker"}"
          else
            normalized="${KEYSTORE_BASE64#ADMIN_RELEASE_KEYSTORE_BASE64=}"
          fi
          normalized="$(printf '%s' "$normalized" | tr -cd 'A-Za-z0-9+/=')"
          normalized="${normalized:0:5196}"
          if [[ "${#normalized}" -ne 5196 ]]; then
            printf '::error::Base64 release-ключа имеет неверную длину после очистки. Ожидалось 5196 символов.\n'
            exit 1
          fi
          printf '%s' "$normalized" | tr -d '[:space:]' | base64 --decode > release.keystore
          test -s release.keystore
          expected='86b610757b38329dd644dc2537c9f8664d51adc1e7c074dd7a081a9d41d7c90a'
          actual="$(sha256sum release.keystore | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            printf '::error::Восстановленный JKS не совпадает с резервной копией.\n'
            exit 1
          fi
          chmod 600 release.keystore

      - name: Сборка подписанного release APK
        if: steps.release_secrets.outputs.enabled == 'true'
        env:
          ORG_GRADLE_PROJECT_ADMIN_RELEASE_STORE_FILE: ../release.keystore
          ORG_GRADLE_PROJECT_ADMIN_RELEASE_STORE_PASSWORD: ${{ secrets.ADMIN_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_ADMIN_RELEASE_KEY_ALIAS: ${{ secrets.ADMIN_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_ADMIN_RELEASE_KEY_PASSWORD: ${{ secrets.ADMIN_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace

      - name: Проверка release-подписи
        if: steps.release_secrets.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ADMIN_VERSION_NAME=//p' gradle.properties | tail -n 1 | tr -d '\r')"
          apk="app/build/outputs/apk/release/app-release.apk"
          verify_output="$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verify_output"
          expected='Signer #1 certificate SHA-256 digest: c6b600f8a6d6f32f325172407e7a76d7bf44f9962b357d2eb2ba99f78f002f5e'
          if ! grep -Fqi "$expected" <<< "$verify_output"; then
            printf '::error::APK подписан неизвестным сертификатом.\n'
            exit 1
          fi
          mkdir -p dist-release
          cp "$apk" "dist-release/GsGit-Admin-${version}-release.apk"
          cd dist-release
          sha256sum "GsGit-Admin-${version}-release.apk" > SHA256SUMS.txt

      - name: Загрузка подписанного release APK
        if: steps.release_secrets.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gsgit-admin-release-${{ github.run_number }}
          path: dist-release/
          if-no-files-found: error
          retention-days: 14

      - name: Удаление release-ключа с runner
        if: always()
        run: rm -f release.keystore
